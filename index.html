<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocDaily Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; font-style: normal !important; -webkit-tap-highlight-color: transparent; }
        body { -webkit-font-smoothing: antialiased; background-color: #f7fee7; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-slow { animation: bounce-subtle 2s infinite ease-in-out; }
        
        /* Custom styles for the API key input to match theme */
        .api-input:focus {
            box-shadow: 0 0 0 4px rgba(190, 242, 100, 0.2);
            border-color: #bef264;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Default API Key provided by user
        const DEFAULT_API_KEY = "AIzaSyAAB_7Wn6I1gUXf5Zi1v3ZcM4mEM7-wCk4";

        const getEnvApiKey = () => {
            const saved = localStorage.getItem('socDaily_apiKey');
            return saved || DEFAULT_API_KEY; 
        };

        const toKebabCase = (str) => str.replace(/[A-Z0-9]/g, letter => `-${letter.toLowerCase()}`).replace(/^-/, '');

        const Icon = ({ name, className }) => {
            const [iconContent, setIconContent] = useState('');
            useEffect(() => {
                const updateIcon = () => {
                    if (window.lucide && window.lucide.icons) {
                        const kebabName = toKebabCase(name);
                        const icon = window.lucide.icons[name] || window.lucide.icons[kebabName];
                        
                        if (icon && Array.isArray(icon)) {
                            const attrs = { ...icon[1], class: className, xmlns: "http://www.w3.org/2000/svg" };
                            const children = Array.isArray(icon[2]) ? icon[2] : [];
                            const svgPaths = children.map(child => {
                                if (!child || !Array.isArray(child)) return '';
                                const attrString = Object.entries(child[1] || {}).map(([k, v]) => `${k}="${v}"`).join(' ');
                                return `<${child[0]} ${attrString} />`;
                            }).join('');
                            const rootAttrString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                            setIconContent(`<svg ${rootAttrString}>${svgPaths}</svg>`);
                        }
                    }
                };
                updateIcon();
                const interval = setInterval(updateIcon, 500);
                setTimeout(() => clearInterval(interval), 3000);
                return () => clearInterval(interval);
            }, [name, className]);
            
            return <span className="inline-flex items-center justify-center" dangerouslySetInnerHTML={{ __html: iconContent }} />;
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [loading, setLoading] = useState(true);
            const [refreshing, setRefreshing] = useState(false);
            const [error, setError] = useState(null);
            const [showKeySetup, setShowKeySetup] = useState(false);
            const [tempKey, setTempKey] = useState("");
            
            const [allQuestions, setAllQuestions] = useState([]);
            const [currentRawText, setCurrentRawText] = useState("");
            const [aiAnalysis, setAiAnalysis] = useState(null);
            const [topicImages, setTopicImages] = useState([]);
            const [quizState, setQuizState] = useState({ active: false, currentIdx: 0, score: 0, completed: false, answers: [] });
            
            const [isInstallable, setIsInstallable] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [isGeneratingAudio, setIsGeneratingAudio] = useState(false);
            const audioRef = useRef(null);

            const apiKey = getEnvApiKey();

            const getSavedIndex = () => parseInt(localStorage.getItem('socDaily_currentIndex') || '0', 10);
            const getSavedTimestamp = () => parseInt(localStorage.getItem('socDaily_lastUpdate') || '0', 10);
            const saveProgression = (index) => {
                localStorage.setItem('socDaily_currentIndex', index.toString());
                localStorage.setItem('socDaily_lastUpdate', Date.now().toString());
            };

            const handleSaveKey = () => {
                if (tempKey.trim().length < 20) {
                    alert("Please enter a valid Gemini API Key.");
                    return;
                }
                localStorage.setItem('socDaily_apiKey', tempKey.trim());
                setShowKeySetup(false);
                window.location.reload();
            };

            useEffect(() => {
                const splashTimer = setTimeout(() => setShowSplash(false), 3000);

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });

                const fetchData = async () => {
                    try {
                        const response = await fetch('https://raw.githubusercontent.com/CioalTutors/SocDaily/main/questionbank.txt');
                        if (!response.ok) throw new Error('Cannot reach repository. Check your connection.');
                        const text = await response.text();
                        const entries = text.split(/\n\s*\n/).filter(e => e.trim().length > 10);
                        if (entries.length === 0) throw new Error('Repository question bank is empty.');
                        
                        setAllQuestions(entries);

                        const lastIdx = getSavedIndex();
                        const lastTime = getSavedTimestamp();
                        const now = Date.now();
                        
                        if (now - lastTime >= 3600000 && lastTime !== 0) { 
                            const nextIdx = (lastIdx + 1) % entries.length;
                            saveProgression(nextIdx);
                            await loadTopic(entries[nextIdx]);
                        } else {
                            if (lastTime === 0) saveProgression(0);
                            await loadTopic(entries[lastIdx % entries.length]);
                        }
                    } catch (err) {
                        setError(err.message);
                        setLoading(false);
                    }
                };
                fetchData();

                return () => clearTimeout(splashTimer);
            }, []);

            const loadTopic = async (rawText) => {
                try {
                    setCurrentRawText(rawText);
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Topic: ${rawText}` }] }],
                            systemInstruction: { parts: [{ text: "Analyze Sociology text. Return JSON: mainPoints (4 items), infographicTitle, imagePrompts (3 items), quiz (10 multiple choice). No Markdown." }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    
                    if (response.status === 403 || response.status === 401) {
                        setError("Unauthorized: The provided API key is invalid or has expired.");
                        setLoading(false);
                        return;
                    }
                    
                    if (!response.ok) throw new Error('Intelligence engine synchronization failed.');
                    
                    const data = await response.json();
                    const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!textResponse) throw new Error('Empty response from AI engine.');
                    
                    const analysis = JSON.parse(textResponse);
                    setAiAnalysis(analysis);

                    const imgPromises = analysis.imagePrompts.map(p => generateImage(p));
                    const imgs = await Promise.all(imgPromises);
                    setTopicImages(imgs.filter(img => img !== null));

                    setLoading(false);
                    setRefreshing(false);
                } catch (err) {
                    console.error(err);
                    setError("Synchronization error: The AI engine encountered an issue.");
                    setLoading(false);
                    setRefreshing(false);
                }
            };

            const generateImage = async (p) => {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: `${p}, minimalist pencil sketch, white background, simple thin lines, educational illustration` },
                            parameters: { sampleCount: 1 }
                        })
                    });
                    if (!res.ok) return null;
                    const result = await res.json();
                    return result.predictions?.[0]?.bytesBase64Encoded ? `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}` : null;
                } catch { return null; }
            };

            const handleReadAloud = async () => {
                if (isSpeaking) { audioRef.current?.pause(); setIsSpeaking(false); return; }
                if (audioRef.current) { audioRef.current.play(); setIsSpeaking(true); return; }

                try {
                    setIsGeneratingAudio(true);
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Narrate clearly: ${currentRawText.slice(0, 1500)}` }] }],
                            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } } }
                        })
                    });
                    const result = await res.json();
                    const audioData = result.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                    if (!audioData) throw new Error("No audio");

                    const b64 = audioData.data;
                    const pcm = atob(b64);
                    const len = pcm.length;
                    const buffer = new ArrayBuffer(44 + len);
                    const view = new DataView(buffer);
                    const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
                    writeStr(0, 'RIFF'); view.setUint32(4, 36 + len, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
                    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, 24000, true); view.setUint32(28, 48000, true); view.setUint16(32, 2, true);
                    view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, len, true);
                    const bytes = new Uint8Array(buffer);
                    for (let i = 0; i < len; i++) bytes[44 + i] = pcm.charCodeAt(i);
                    const audio = new Audio(URL.createObjectURL(new Blob([buffer], {type: 'audio/wav'})));
                    audioRef.current = audio;
                    audio.onended = () => setIsSpeaking(false);
                    audio.play();
                    setIsSpeaking(true);
                } catch (err) { console.error(err); } finally { setIsGeneratingAudio(false); }
            };

            const handleQuizAnswer = (idx) => {
                const isCorrect = idx === aiAnalysis.quiz[quizState.currentIdx].correctIndex;
                const newAnswers = [...quizState.answers, { question: quizState.currentIdx, selected: idx, correct: isCorrect }];
                if (quizState.currentIdx < aiAnalysis.quiz.length - 1) {
                    setQuizState({ ...quizState, currentIdx: quizState.currentIdx + 1, score: isCorrect ? quizState.score + 1 : quizState.score, answers: newAnswers });
                } else {
                    setQuizState({ ...quizState, completed: true, score: isCorrect ? quizState.score + 1 : quizState.score, answers: newAnswers });
                }
            };

            // Smart Splitter: Breaks text into chunks of roughly 2-3 sentences to keep paragraphs small
            const getMiniParagraphs = (text) => {
                const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
                const chunks = [];
                for (let i = 0; i < sentences.length; i += 2) {
                    chunks.push(sentences.slice(i, i + 2).join(' ').trim());
                }
                return chunks;
            };

            if (showSplash) {
                return (
                    <div className="fixed inset-0 bg-[#f7fee7] z-[100] flex flex-col items-center justify-center p-6">
                        <img src="https://raw.githubusercontent.com/CioalTutors/SocDaily/main/cioaltutors.jpg" className="w-64 h-64 rounded-[3rem] shadow-2xl border-8 border-white animate-bounce-slow" alt="Cioal Tutors" />
                        <h2 className="mt-12 text-2xl font-black text-lime-900 tracking-tighter uppercase text-center">Cioal Tutors</h2>
                    </div>
                );
            }

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-[#f7fee7] p-6 text-center">
                    <div className="w-16 h-16 border-4 border-lime-200 border-t-lime-600 rounded-full animate-spin mb-6"></div>
                    <p className="font-bold text-lime-800 text-xl tracking-tight">Booting Intelligence Engine...</p>
                </div>
            );

            if (error) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-[#f7fee7] p-6 text-center">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl border-4 border-red-50 max-w-md">
                        <Icon name="AlertCircle" className="text-red-500 w-12 h-12 mb-6" />
                        <h2 className="text-2xl font-black text-slate-900 mb-4 tracking-tighter uppercase text-center">Startup Failed</h2>
                        <p className="text-slate-600 font-medium mb-8 leading-relaxed text-center">{error}</p>
                        <button onClick={() => window.location.reload()} className="bg-lime-500 hover:bg-lime-600 text-white font-black py-4 px-8 rounded-2xl shadow-xl uppercase text-xs w-full">Retry Connection</button>
                    </div>
                </div>
            );

            const miniParas = getMiniParagraphs(currentRawText);

            return (
                <div className="pb-24">
                    <header className="bg-white/80 backdrop-blur-2xl border-b border-lime-200 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-lime-500 p-2.5 rounded-2xl shadow-lg shadow-lime-200"><Icon name="GraduationCap" className="text-white w-6 h-6" /></div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-900 uppercase leading-none tracking-tighter">Soc<span className="text-lime-600">Daily</span></h1>
                                    <span className="text-[10px] font-bold text-lime-600 tracking-[0.2em] uppercase">Intelligence Node</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="bg-lime-100 text-lime-700 px-4 py-2 rounded-xl text-[10px] font-bold uppercase border border-lime-200">
                                    Lesson {(getSavedIndex() + 1).toString().padStart(2, '0')}
                                </div>
                                <button onClick={() => setShowKeySetup(true)} className="p-2 text-slate-400 hover:text-lime-600 transition-colors"><Icon name="Settings" className="w-5 h-5" /></button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 mt-12 space-y-12">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                            <div className="lg:col-span-8 space-y-12">
                                <div className="bg-white rounded-[4rem] p-10 md:p-16 shadow-2xl shadow-lime-900/5 border border-lime-100 relative overflow-hidden">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-8 mb-16 relative z-10">
                                        <div className="flex items-center gap-4">
                                            <div className="w-14 h-14 bg-lime-50 rounded-2xl flex items-center justify-center border border-lime-100"><Icon name="Sparkles" className="w-7 h-7 text-lime-600" /></div>
                                            <h2 className="text-xl font-bold text-slate-800 tracking-tight">Active Learning Brief</h2>
                                        </div>
                                        <button onClick={handleReadAloud} disabled={isGeneratingAudio} className={`px-8 py-4 rounded-2xl font-black text-xs uppercase transition-all shadow-xl ${isSpeaking ? 'bg-rose-500 text-white' : 'bg-lime-500 text-white hover:bg-lime-600'} flex items-center gap-2`}>
                                            {isGeneratingAudio ? 'Loading...' : isSpeaking ? 'Stop Voice' : 'Hear Lesson'}
                                        </button>
                                    </div>
                                    <div className="space-y-12 relative z-10">
                                        {miniParas.map((p, i) => {
                                            // Image Distribution: Insert 3 images evenly between paragraphs
                                            const step = Math.floor(miniParas.length / (topicImages.length + 1)) || 1;
                                            const imgIndex = i > 0 && i % step === 0 ? (i / step) - 1 : -1;
                                            const displayImg = imgIndex >= 0 && imgIndex < topicImages.length ? topicImages[imgIndex] : null;

                                            return (
                                                <React.Fragment key={i}>
                                                    <p className={`text-base md:text-lg font-medium leading-relaxed text-slate-600 tracking-tight ${i === 0 ? 'text-xl md:text-2xl font-black text-slate-900 leading-tight mb-2' : ''}`}>
                                                        {p}
                                                    </p>
                                                    {displayImg && (
                                                        <div className="rounded-[3rem] overflow-hidden shadow-xl border-4 border-white aspect-[16/9] bg-[#fafafa] flex items-center justify-center p-8 transition-transform hover:scale-[1.01]">
                                                            <img src={displayImg} className="max-w-full max-h-full object-contain mix-blend-multiply opacity-80" alt="Lesson Visual" />
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-4 space-y-12">
                                <div className="bg-slate-900 rounded-[3.5rem] p-10 text-white shadow-2xl relative overflow-hidden">
                                    <h3 className="text-[10px] font-bold mb-10 flex items-center gap-3 text-lime-400 uppercase tracking-widest"><Icon name="Lightbulb" className="w-4 h-4" /> CORE TAKEAWAYS</h3>
                                    <ul className="space-y-8">
                                        {aiAnalysis?.mainPoints.map((p, i) => (
                                            <li key={i} className="flex gap-5 text-slate-300 text-sm leading-relaxed"><Icon name="CheckCircle2" className="w-6 h-6 text-lime-500 shrink-0 mt-0.5" /><span className="font-medium">{p}</span></li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="bg-white rounded-[3.5rem] p-10 shadow-xl border border-lime-100">
                                    <h3 className="text-[10px] font-bold text-slate-400 flex items-center gap-3 mb-10 uppercase tracking-widest"><Icon name="Brain" className="w-4 h-4 text-lime-600" /> PROFICIENCY CHECK</h3>
                                    {!quizState.active && !quizState.completed ? (
                                        <div className="text-center py-6">
                                            <p className="text-slate-400 text-xs mb-8 font-medium uppercase tracking-widest">Mastery Assessment</p>
                                            <button onClick={() => setQuizState({ ...quizState, active: true })} className="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black text-xs uppercase shadow-xl hover:bg-slate-800 transition-colors">START TEST</button>
                                        </div>
                                    ) : quizState.completed ? (
                                        <div>
                                            <div className="text-center mb-8">
                                                <div className="w-24 h-24 bg-lime-50 text-lime-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-black border-4 border-lime-100">{quizState.score}/10</div>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Review Complete</p>
                                            </div>
                                            <div className="space-y-4 max-h-[400px] overflow-y-auto no-scrollbar pr-2 border-t pt-6">
                                                {aiAnalysis.quiz.map((q, idx) => {
                                                    const userAns = quizState.answers.find(a => a.question === idx);
                                                    return (
                                                        <div key={idx} className={`p-5 rounded-3xl border transition-colors ${userAns.correct ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}>
                                                            <p className="text-xs font-bold text-slate-800 mb-2">{q.question}</p>
                                                            <p className="text-[10px] font-bold uppercase text-slate-500">Answer: <span className={userAns.correct ? 'text-green-700' : 'text-red-700'}>{q.options[userAns.selected]}</span></p>
                                                            {!userAns.correct && <p className="text-[10px] font-black uppercase text-green-700 mt-1">Correct: {q.options[q.correctIndex]}</p>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <button onClick={() => setQuizState({ active: false, currentIdx: 0, score: 0, completed: false, answers: [] })} className="w-full mt-8 text-[10px] font-bold text-lime-600 uppercase tracking-widest hover:bg-lime-50 py-3 rounded-xl border border-lime-100 text-center transition-colors">Back to Lesson</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-8">
                                            <div className="flex justify-between items-center text-[10px] font-bold text-slate-300 uppercase"><span>PROGRESS</span><span className="text-lime-600">{quizState.currentIdx + 1}/10</span></div>
                                            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div className="bg-lime-500 h-full transition-all duration-700" style={{ width: `${((quizState.currentIdx + 1) / 10) * 100}%` }} /></div>
                                            <p className="font-bold text-slate-900 leading-snug text-lg">{aiAnalysis.quiz[quizState.currentIdx].question}</p>
                                            <div className="space-y-3">
                                                {aiAnalysis.quiz[quizState.currentIdx].options.map((opt, i) => (
                                                    <button key={i} onClick={() => handleQuizAnswer(i)} className="w-full text-left p-5 rounded-[1.8rem] border border-slate-100 hover:border-lime-500 hover:bg-lime-50 text-sm font-bold flex items-center justify-between group shadow-sm transition-all hover:-translate-y-0.5"><span>{opt}</span><Icon name="ChevronRight" className="w-4 h-4 opacity-0 group-hover:opacity-100 text-lime-500" /></button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="max-w-7xl mx-auto px-6 mt-32 text-center border-t border-lime-200/40 pt-16 pb-24 opacity-60">
                        <img src="https://raw.githubusercontent.com/CioalTutors/SocDaily/main/cioaltutors.jpg" className="w-20 h-20 rounded-[2rem] mx-auto mb-8 shadow-xl shadow-lime-900/10 transition-transform hover:scale-110" alt="Cioal Tutors" />
                        <p className="text-[10px] font-bold uppercase tracking-[0.5em] text-slate-900">Education Intelligence System • Cioal Tutors</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
